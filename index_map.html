const SITES = [{"name": "Playa Blanca", "lat": 8.3512, "lon": -80.1345}, {"name": "Altos del Maria", "lat": 8.648, "lon": -80.01}];
const map = L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
}).addTo(map);

function popup(p, lat, lon) {
  const gm = 'https://www.google.com/maps/search/?api=1&query=' + lat.toFixed(5) + ',' + lon.toFixed(5);
  const depthLine = p.depth > 0 ? p.depth.toFixed(0) + ' km' : 'n/a';
  return '<div class="popup"><div class="hdr">M' + p.mag.toFixed(1) + ' - ' + (p.place_name || p.catalog_place) + '</div>'
    + '<b>Magnitude:</b> ' + p.mag.toFixed(1) + ' (' + p.src + ')<br>'
    + '<b>Depth:</b> ' + depthLine + ' &middot; <b>' + p.setting + '</b><br>'
    + '<b>Location:</b> ' + (p.place_name || p.catalog_place) + ' (' + lat.toFixed(4) + ', ' + lon.toFixed(4) + ')<br>'
    + '<b>Local time:</b> ' + p.local + ' on ' + p.date + ' (UTC-5)<br>'
    + '<b>UTC:</b> ' + p.utc + '<br>'
    + '<b>Cause:</b> ' + p.cause + '<br>'
    + '<b>Tsunami flag:</b> ' + p.tsunami + '<br>'
    + '<a href="' + gm + '" target="_blank">Open in Google Maps</a></div>';
}

const layer = L.geoJSON(GEO, {
  pointToLayer: (f, latlng) => L.circleMarker(latlng, {
    radius: f.properties.radius, color: f.properties.color, weight: 2,
    fillColor: f.properties.color, fillOpacity: 0.55
  }),
  onEachFeature: (f, l) => {
    const lat = f.geometry.coordinates[1], lon = f.geometry.coordinates[0];
    l.bindPopup(popup(f.properties, lat, lon));
    l.bindTooltip('M' + f.properties.mag.toFixed(1) + ' ' + (f.properties.place_name || f.properties.catalog_place), {
      direction: 'top', className: 'site-tip'
    });
  }
}).addTo(map);

const siteLayer = L.layerGroup(SITES.map(s =>

    '<div class="popup site-pin">' + s.name + '<br><span style="font-weight:400">Your tracked location</span></div>')
    .bindTooltip(s.name, {permanent: true, direction: 'top', className: 'site-tip'})
)).addTo(map);

const b = layer.getBounds().pad(0.15);
map.fitBounds(b, {maxZoom: 9});
