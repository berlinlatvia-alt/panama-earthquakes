const map = L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
}).addTo(map);

function popup(p, lat, lon) {
  const gm = 'https://www.google.com/maps/search/?api=1&query=' + lat.toFixed(5) + ',' + lon.toFixed(5);
  return '<div class="popup"><div class="hdr">M' + p.mag.toFixed(1) + ' - ' + (p.place_name || p.catalog_place) + '</div>'
    + '<b>Local:</b> ' + p.local + ' (UTC-5) &middot; ' + p.date + '<br>'
    + '<b>UTC:</b> ' + p.utc + '<br>'
    + '<b>Coordinates:</b> ' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '<br>'
    + '<b>Depth:</b> ' + p.depth.toFixed(0) + ' km &middot; <b>' + p.setting + '</b><br>'
    + '<b>Cause:</b> ' + p.cause + '<br>'
    + '<b>Source:</b> ' + p.src + ' (place: ' + p.place_src + ')<br>'
    + '<a href="' + gm + '" target="_blank">Open in Google Maps</a></div>';
}

const layer = L.geoJSON(GEO, {
  pointToLayer: (f, latlng) => L.circleMarker(latlng, {
    radius: f.properties.radius, color: f.properties.color, weight: 2,
    fillColor: f.properties.color, fillOpacity: 0.55
  }),
  onEachFeature: (f, l) => l.bindPopup(popup(f.properties, f.geometry.coordinates[1], f.geometry.coordinates[0]))
}).addTo(map);

const siteLayer = L.layerGroup(SITES.map(s =>

    '<div class="popup site-pin">' + s.name + '<br><span style="font-weight:400">Your tracked location</span></div>')

)).addTo(map);

const b = layer.getBounds().pad(0.15);
map.fitBounds(b, {maxZoom: 9});
