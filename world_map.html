  return '<div class="popup"><div class="hdr">' + magLine + ' - ' + p.place + '</div>'
    + '<b>Depth:</b> ' + depthLine + '<br>'
    + '<b>Location:</b> (' + lat.toFixed(2) + ', ' + lon.toFixed(2) + ')<br>'
    + '<b>Origin (UTC):</b> ' + p.t_iso + '<br>'
    + '<b>Catalogs:</b> ' + (p.catalogs || ['?']).join(', ') + '<br>'
    + '<b>Tsunami flag:</b> ' + (p.tsunami ? '1' : '0 (absence is not an all-clear)') + '<br>'
    + dupLine + hypLine
    + '<a href="' + gm + '" target="_blank">Open in Google Maps</a></div>';
}
/* HYPOTHESIS_OVERLAYS: evidence-gated labels (ASTRA-6) */
GEO.features.forEach(function(f){
  var p = f.properties;
  if (p.mag >= 5 && p.lat > -5 && p.lat < 5 && p.lon > -30 && p.lon < -10 && p.place && p.place.indexOf('Mid-Atlantic') >= 0) {
    p.hypothesis = 'Candidate related ridge sequence (unconfirmed: needs relocated hypocenters + moment tensors)';
  }
  if (p.mag >= 5 && p.lon < -75 && p.lon > -85 && p.lat > 5 && p.lat < 10) {
    p.hypothesis = 'Aftershock candidate of 2026-10-09 Azuero M7.7 (plausible, not confirmed)';
  }
});

const map = L.map('map', { worldCopyJump: true });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
}).addTo(map);

window.quakeLayer = L.geoJSON(GEO, {
  pointToLayer: function(f, latlng) {
    return L.circleMarker(latlng, {
      radius: f.properties.radius, color: f.properties.color, weight: 2,
      fillColor: f.properties.color, fillOpacity: 0.6
    });
  },
  onEachFeature: function(f, l) {
    var c = f.geometry.coordinates;
    var p = f.properties;
    l.bindPopup(popup(p, c[1], c[0]));
    l.bindTooltip('M' + p.mag.toFixed(1) + ' ' + p.place + ' ' + p.t_iso.slice(11, 16) + 'Z',
      { direction: 'top', className: 'site-tip' });
  }
}).addTo(map);
const layer = window.quakeLayer;

const haloGroup = L.layerGroup().addTo(map);
layer.eachLayer(function(l){
  var p = l.feature.properties;
  var ll = l.getLatLng();
  p._halo = L.circleMarker(ll, { radius: p.radius + 6, color: '#a855f7', weight: 3, opacity: 0, fill: false }).addTo(haloGroup);
});
window.setTimeout(function(){ try { map.invalidateSize(); } catch(e){} }, 500);

/* ---- Rule 1.8: magnitude band filter (pins + table rows) ---- */
function bandOf(mag) { return mag >= 5 ? 'cbM5' : mag >= 4 ? 'cbM4' : mag >= 3 ? 'cbM3' : 'cbM2'; }
function onFor(mag) {
  var id = bandOf(mag);
  return document.getElementById(id).checked;
}
function applyMagFilter() {
  layer.eachLayer(function(l){
    var p = l.feature.properties;
    var on = onFor(p.mag);
    l.setStyle({ opacity: on ? 1 : 0.06, fillOpacity: on ? 0.6 : 0.02 });
    if (l.getElement()) l.getElement().style.pointerEvents = on ? 'auto' : 'none';
    var halo = p._halo;
    if (halo) halo.setStyle({ opacity: (halo.options._active && on) ? 0.9 : 0 });
  });
  document.querySelectorAll('#evtbody tr').forEach(function(tr){
    tr.style.display = onFor(parseFloat(tr.dataset.mag)) ? '' : 'none';
  });
}
GEO.features.forEach(function(f, i){ f.properties._id = i; });

/* ---- EVIDENCE CLOCK + purple halo: origin-based, 1-min live refresh ---- */
function dataMaxMs() {
  var m = 0;
  GEO.features.forEach(function(f){ if (f.properties.utc_ms > m) m = f.properties.utc_ms; });
  return m;
}
function updateHalos() {
  var now = Date.now();
  var wm = timeFilterActive();
  var recent = 0;
  layer.eachLayer(function(l){
    var p = l.feature.properties;
    var isRecent = (now - p.utc_ms) >= 0 && (now - p.utc_ms) < 3600000;
    var inW = wm === null || ((now - p.utc_ms) >= 0 && (now - p.utc_ms) <= wm);
    if (isRecent && inW) recent++;
    p._halo.options._active = isRecent && inW;
    p._halo.setStyle({ opacity: (isRecent && inW && onFor(p.mag)) ? 0.9 : 0 });
  });
  document.getElementById('clock').innerHTML =
    'evidence clock: ' + new Date().toISOString().slice(11, 19) + 'Z &middot; origin-halos active: ' + recent +
    '<br><b>generated:</b> ' + SUMMARY.generated_utc;
  var el = document.getElementById('timecount');
  if (el) {
    var inWin = 0;
    layer.eachLayer(function(l){
      var p = l.feature.properties;
      if (wm === null || ((now - p.utc_ms) >= 0 && (now - p.utc_ms) <= wm)) inWin++;
    });
    el.textContent = (wm === null ? 'all events' : 'in window: ' + inWin) + ' — data age: ' + ((now - dataMaxMs()) / 3600000).toFixed(1) + 'h';
  }
}

/* ---- Time window filter (pins + table rows) ---- */
var TIME_60 = 3600000;  // 60 min
var TIME_75 = 4500000;  // 75 min (1h15m)
function timeFilterActive() {
  var t60 = document.getElementById('cbT60').checked;
  var t75 = document.getElementById('cbT75').checked;
  var tall = document.getElementById('cbTAll').checked;
  if (tall) return null;  // show all
  if (t60 && !t75) return TIME_60;
  if (t75 && !t60) return TIME_75;
  if (t60 && t75) return TIME_75;  // wider window if both
  return TIME_60;  // default to 60 if none checked
}
function applyTimeFilter() {
  var windowMs = timeFilterActive();
  var now = Date.now();
  layer.eachLayer(function(l){
    var p = l.feature.properties;
    var magOn = onFor(p.mag);
    var opacity, fillOpacity, interactive;
    if (windowMs === null) {
      opacity = magOn ? 1 : 0.06; fillOpacity = magOn ? 0.6 : 0.02; interactive = magOn;
    } else {
      var age = now - p.utc_ms;
      var shown = magOn && age >= 0 && age <= windowMs;
      opacity = shown ? 1 : 0; fillOpacity = shown ? 0.6 : 0; interactive = shown;
    }
    l.setStyle({ opacity: opacity, fillOpacity: fillOpacity });
    if (l.getElement()) l.getElement().style.pointerEvents = interactive ? 'auto' : 'none';
  });
  if (window.liveGroup) {
    window.liveGroup.eachLayer(function(l){
      var ms = l.options._utc || 0;
      var shown = windowMs === null || (ms > 0 && (now - ms) >= 0 && (now - ms) <= windowMs);
      l.setStyle({ opacity: shown ? 1 : 0, fillOpacity: shown ? 0.5 : 0 });
      if (l.getElement()) l.getElement().style.pointerEvents = shown ? 'auto' : 'none';
    });
  }
  document.querySelectorAll('#evtbody tr').forEach(function(tr){
    if (windowMs === null) {
      tr.style.display = onFor(parseFloat(tr.dataset.mag)) ? '' : 'none';
      return;
    }
    var rowMag = parseFloat(tr.dataset.mag);
    var rowTime = Date.parse(tr.querySelector('td:last-child').textContent + 'Z'); // rough
    // Better: store utc_ms on row
    var rowMs = parseInt(tr.dataset.utc_ms || '0');
    var age = now - (rowMs || 0);
    var inWindow = rowMs > 0 && age >= 0 && age <= windowMs;
    tr.style.display = (onFor(rowMag) && inWindow) ? '' : 'none';
  });
}
['cbT60','cbT75','cbTAll'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){ applyMagFilter(); applyTimeFilter(); updateHalos(); });
});

['cbM5','cbM4','cbM3','cbM2'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){ applyMagFilter(); applyTimeFilter(); updateHalos(); });
});
applyMagFilter();
applyTimeFilter();
updateHalos();
setInterval(function(){ updateHalos(); applyTimeFilter(); }, 60000);

/* ---- table ---- */
const rows = GEO.features.slice().sort(function(a, b){ return b.properties.utc_ms - a.properties.utc_ms; })
  .map(function(f){
    var p = f.properties, c = f.geometry.coordinates;
    var tr = document.createElement('tr');
    tr.className = 'row';
    tr.dataset.id = p._id;
    tr.dataset.mag = p.mag;
    tr.dataset.utc_ms = p.utc_ms;
    tr.innerHTML = '<td class="mag" style="color:' + p.color + '">M' + p.mag.toFixed(1) + '</td>'
      + '<td>' + (p.depth > 0 ? p.depth.toFixed(0) : 'n/a') + '</td>'
      + '<td>' + p.place + '</td>'
      + '<td>' + p.t_iso.slice(11, 16) + 'Z</td>';
    tr.onclick = function(){
      layer.eachLayer(function(l){ if (l.feature === f) l.fire('click'); });
      map.flyTo([c[1], c[0]], Math.max(map.getZoom(), 4), { duration: 0.8 });
    };
    return tr;
  });
var tbody = document.getElementById('evtbody');
rows.forEach(function(r){ tbody.appendChild(r); });
applyMagFilter();
applyTimeFilter();
updateHalos();

/* ---- storms (NHC live pins) ---- */
const stormLayer = L.layerGroup();
STORMS.forEach(function(s){
  var icon = L.divIcon({ className: 'storm-pin', html: '<div class="storm">S</div>', iconSize: [18, 18] });
  var m = L.marker([s.lat, s.lon], { icon: icon }).bindPopup(
    '<div class="popup"><div class="hdr">' + s.name + ' - ' + s.cls + '</div>'
    + '<b>Position:</b> ' + s.lat.toFixed(1) + ', ' + s.lon.toFixed(1) + '<br>'
    + '<b>Movement:</b> ' + s.mov + '<br><b>Wind:</b> ' + (s.wind || 'n/a') + ' kt</div>')
    .bindTooltip(s.name + ' ' + s.cls, { className: 'site-tip' });
  stormLayer.addLayer(m);
});
stormLayer.addTo(map);

/* ---- GIBS satellite overlay ---- */
const gibtoday = new Date().toISOString().slice(0, 10).replace(/-/g, '');
const liveSatLayer = L.tileLayer(
  'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/' + gibtoday +
  '/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg', { maxZoom: 9, attribution: 'NASA GIBS / EOSDIS' });

/* ---- USGS live FDSN feed (self-refresh 60s) ---- */
window.liveGroup = L.layerGroup();
function loadLiveSensors() {
  const st = new Date(Date.now() - 12 * 3600 * 1000).toISOString().slice(0, 19).replace('T', '');
  const url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=' + st +
    '&minmagnitude=4.5&orderby=time';
  fetch(url).then(r => r.json()).then(function(d){
    window.liveGroup.clearLayers();
    var seen = new Set(GEO.features.map(f => f.properties.utc_ms));
    (d.features || []).forEach(function(f){
      var p = f.properties, c = f.geometry.coordinates;
      var ms = new Date(p.time).getTime();
      if (seen.has(ms)) return;
      var m = L.circleMarker([c[1], c[0]], {
        radius: 6 + (p.mag - 4) * 2, color: '#00e5ff', weight: 1.5, fillColor: '#00e5ff', fillOpacity: 0.5
      })
        .bindPopup('<div class="popup"><div class="hdr">LIVE M' + p.mag + ' - ' + p.place + '</div>'
          + '<b>UTC:</b> ' + new Date(p.time).toISOString().slice(11, 19) + '</div>')
        .bindTooltip('LIVE M' + p.mag + ' ' + p.place, { className: 'site-tip' });
      m.options._utc = ms;
      window.liveGroup.addLayer(m);
    });
    applyTimeFilter();
    document.getElementById('livecount').textContent = 'USGS live: ' + d.features.length + ' (12h M4.5+)';
  }).catch(function(){ document.getElementById('livecount').textContent = 'live feed unavailable'; });
}

document.getElementById('cbStorms').addEventListener('change', function(e){
  if (e.target.checked) stormLayer.addTo(map); else map.removeLayer(stormLayer);
});
document.getElementById('cbLiveSat').addEventListener('change', function(e){
  if (e.target.checked) liveSatLayer.addTo(map); else map.removeLayer(liveSatLayer);
});
document.getElementById('cbLiveSens').addEventListener('change', function(e){
  if (e.target.checked) { window.liveGroup.addTo(map); loadLiveSensors(); window.__liveTimer = setInterval(loadLiveSensors, 60000); }
  else { if (window.__liveTimer) clearInterval(window.__liveTimer); map.removeLayer(window.liveGroup); }
});

const b = layer.getBounds().pad(0.1);
try { map.fitBounds(b, { maxZoom: 3 }); } catch(e){ map.setView([0, 0], 2); }
</script>
